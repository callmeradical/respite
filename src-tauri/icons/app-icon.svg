<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Clip everything to the rounded icon shape -->
    <clipPath id="clip">
      <rect width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>
    <!-- Blue gradient for the header band -->
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#42B8FF"/>
      <stop offset="100%" stop-color="#0068D6"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip)">

    <!-- ── White background ── -->
    <rect width="1024" height="1024" fill="#FFFFFF"/>

    <!-- ── Blue header band ── -->
    <rect width="1024" height="416" fill="url(#hdr)"/>

    <!-- ── Ring binders ─────────────────────────────────────────────── -->
    <!-- Left ring — outer shell -->
    <rect x="300" y="-18" width="58" height="134" rx="29" fill="#7B92A8"/>
    <!-- Left ring — inner light fill (gap) -->
    <rect x="308" y="32"  width="42" height="90"  rx="0"  fill="#C8DAE8"/>
    <!-- Right ring — outer shell -->
    <rect x="666" y="-18" width="58" height="134" rx="29" fill="#7B92A8"/>
    <!-- Right ring — inner light fill (gap) -->
    <rect x="674" y="32"  width="42" height="90"  rx="0"  fill="#C8DAE8"/>

    <!-- ── Month label ── -->
    <text x="512" y="164"
      font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
      font-size="72" font-weight="700" letter-spacing="10"
      fill="rgba(255,255,255,0.65)"
      text-anchor="middle" dominant-baseline="middle">
      MAY
    </text>

    <!-- ── Large date number ── -->
    <text x="512" y="330"
      font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
      font-size="216" font-weight="800" letter-spacing="-12"
      fill="white"
      text-anchor="middle" dominant-baseline="middle">
      25
    </text>

    <!-- ── Header / body separator ── -->
    <rect x="0" y="415" width="1024" height="2" fill="rgba(0,0,0,0.07)"/>

    <!-- ── Day name headers: S M T W T F S ────────────────────────── -->
    <!-- Column centers (7 equal cols, 48px side padding):
         col width = (1024-96)/7 ≈ 132.6
         centers:  114  247  380  513  646  779  912              -->
    <text x="114" y="470" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#C4C4C4" text-anchor="middle" dominant-baseline="middle">S</text>
    <text x="247" y="470" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#C4C4C4" text-anchor="middle" dominant-baseline="middle">M</text>
    <text x="380" y="470" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#C4C4C4" text-anchor="middle" dominant-baseline="middle">T</text>
    <text x="513" y="470" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#C4C4C4" text-anchor="middle" dominant-baseline="middle">W</text>
    <text x="646" y="470" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#C4C4C4" text-anchor="middle" dominant-baseline="middle">T</text>
    <text x="779" y="470" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#C4C4C4" text-anchor="middle" dominant-baseline="middle">F</text>
    <text x="912" y="470" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#C4C4C4" text-anchor="middle" dominant-baseline="middle">S</text>

    <!-- Separator line below day names -->
    <line x1="52" y1="496" x2="972" y2="496" stroke="#EBEBEB" stroke-width="2.5"/>

    <!-- ── Date grid — May 2026 (starts Friday = col 5) ────────────── -->
    <!-- Row y-centers: 562, 662, 762, 862, 962  (step = 100)          -->
    <!-- Weekend cols (Sun=114, Sat=912) use grey; weekdays use dark    -->

    <!-- Row 1: ·····  1(F,col5=779)  2(S,col6=912) -->
    <text x="779" y="562" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">1</text>
    <text x="912" y="562" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">2</text>

    <!-- Row 2: 3–9 -->
    <text x="114" y="662" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">3</text>
    <text x="247" y="662" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">4</text>
    <text x="380" y="662" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">5</text>
    <text x="513" y="662" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">6</text>
    <text x="646" y="662" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">7</text>
    <text x="779" y="662" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">8</text>
    <text x="912" y="662" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">9</text>

    <!-- Row 3: 10–16 -->
    <text x="114" y="762" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">10</text>
    <text x="247" y="762" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">11</text>
    <text x="380" y="762" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">12</text>
    <text x="513" y="762" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">13</text>
    <text x="646" y="762" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">14</text>
    <text x="779" y="762" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">15</text>
    <text x="912" y="762" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">16</text>

    <!-- Row 4: 17–23 -->
    <text x="114" y="862" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">17</text>
    <text x="247" y="862" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">18</text>
    <text x="380" y="862" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">19</text>
    <text x="513" y="862" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">20</text>
    <text x="646" y="862" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">21</text>
    <text x="779" y="862" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">22</text>
    <text x="912" y="862" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">23</text>

    <!-- Row 5: 24–30, "25" highlighted as today -->
    <text x="114" y="962" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">24</text>

    <!-- Today highlight — blue circle + white number -->
    <circle cx="247" cy="962" r="40" fill="#007AFF"/>
    <text x="247" y="962" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">25</text>

    <text x="380" y="962" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">26</text>
    <text x="513" y="962" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">27</text>
    <text x="646" y="962" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">28</text>
    <text x="779" y="962" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#2C2C2E" text-anchor="middle" dominant-baseline="middle">29</text>
    <text x="912" y="962" font-family="Helvetica, Arial, sans-serif" font-size="50" fill="#8E8E93" text-anchor="middle" dominant-baseline="middle">30</text>

  </g>
</svg>
